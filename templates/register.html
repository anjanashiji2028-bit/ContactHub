{% extends "base.html" %}

{% block title %}Create Account — ContactHub{% endblock %}

{% block public_content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <div class="d-inline-flex p-3 rounded-circle bg-teal-subtle text-teal mb-3">
                        <i class="bi bi-person-plus-fill fs-2"></i>
                    </div>
                    <h3 class="fw-bold text-navy">Join ContactHub</h3>
                    <p class="text-muted small">Register your private contact vault</p>
                </div>

                <form method="POST" action="{{ url_for('register') }}" novalidate>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label for="full_name" class="form-label fw-semibold small">Full Name <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                            <input type="text" class="form-control border-start-0" id="full_name" name="full_name" value="{{ full_name or '' }}" placeholder="e.g. Alex Morgan" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold small">Email Address <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" class="form-control border-start-0" id="email" name="email" value="{{ email or '' }}" placeholder="alex@example.com" required>
                        </div>
                        <div class="form-text very-small">Your email serves as your unique login ID.</div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold small">Password <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="At least 6 characters" required minlength="6">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="confirm_password" class="form-label fw-semibold small">Confirm Password <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-shield-check text-muted"></i></span>
                            <input type="password" class="form-control border-start-0" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required>
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-teal btn-lg shadow-sm">
                            <i class="bi bi-check2-circle me-1"></i> Register Account
                        </button>
                    </div>

                    <div class="text-center small text-muted">
                        Already have an account? <a href="{{ url_for('login') }}" class="text-teal fw-semibold text-decoration-none">Sign In here</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
