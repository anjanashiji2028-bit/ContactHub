{% extends "base.html" %}

{% block title %}Sign In — ContactHub{% endblock %}

{% block public_content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <div class="d-inline-flex p-3 rounded-circle bg-teal-subtle text-teal mb-3">
                        <i class="bi bi-person-check-fill fs-2"></i>
                    </div>
                    <h3 class="fw-bold text-navy">Welcome Back</h3>
                    <p class="text-muted small">Sign in to manage your contacts</p>
                </div>

                <form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}" novalidate>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold small">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" class="form-control border-start-0" id="email" name="email" value="{{ email or '' }}" placeholder="name@example.com" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center">
                            <label for="password" class="form-label fw-semibold small mb-0">Password</label>
                        </div>
                        <div class="input-group mt-1">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="Your password" required>
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-teal btn-lg shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                        </button>
                    </div>

                    <!-- Viva / Demo Quick Fill Helper -->
                    <div class="p-3 bg-light rounded-3 border mb-3 text-start small">
                        <div class="fw-semibold text-secondary mb-1">
                            <i class="bi bi-info-circle text-teal me-1"></i> Quick Demo Account:
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="text-muted"><code>demo@contacthub.local</code> / <code>Demo@12345</code></span>
                            <button type="button" class="btn btn-outline-secondary btn-sm py-0 px-2 very-small" onclick="document.getElementById('email').value='demo@contacthub.local'; document.getElementById('password').value='Demo@12345';">
                                Auto-Fill
                            </button>
                        </div>
                    </div>

                    <div class="text-center small text-muted">
                        Don't have an account? <a href="{{ url_for('register') }}" class="text-teal fw-semibold text-decoration-none">Create one</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
