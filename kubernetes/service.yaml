# Internal ClusterIP Service
apiVersion: v1
kind: Service
metadata:
  name: contacthub-service
  namespace: contacthub
  labels:
    app: contacthub
spec:
  type: ClusterIP
  selector:
    app: contacthub
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      name: http

---
# NodePort Service for easy local demonstration on Minikube / Docker Desktop
apiVersion: v1
kind: Service
metadata:
  name: contacthub-nodeport
  namespace: contacthub
  labels:
    app: contacthub
spec:
  type: NodePort
  selector:
    app: contacthub
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30080
      name: http-nodeport
